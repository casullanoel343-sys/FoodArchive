
<ion-header>
  <ion-toolbar color="success">
    <ion-title>Food Archive</ion-title>
  </ion-toolbar>
</ion-header>

<ion-content class="login-content">

  <div class="login-container">

    <div class="login-logo">
      <ion-icon name="restaurant-outline"></ion-icon>
      <h1>FOOD ARCHIVE</h1>
      <p>Your Personal Recipe Collection</p>
    </div>

    <ion-card class="login-card">

      <ion-card-header>
        <ion-card-title>Welcome Back!</ion-card-title>
        <p>Log in to explore delicious recipes.</p>
      </ion-card-header>

      <ion-card-content>

        <ion-item>
          <ion-icon name="person-outline" slot="start"></ion-icon>
          <ion-input
            label="Email Address"
            labelPlacement="stacked"
            type="email"
            placeholder="Enter your email"
            [(ngModel)]="email">
          </ion-input>
        </ion-item>

        <ion-item>
          <ion-icon name="lock-closed-outline" slot="start"></ion-icon>
          <ion-input
            label="Password"
            labelPlacement="stacked"
            type="password"
            placeholder="Enter your password"
            [(ngModel)]="password">
          </ion-input>
        </ion-item>

        <ion-button
          expand="block"
          color="success"
          class="login-button"
          [disabled]="loading"
          (click)="login()">

          @if (loading) {
            <ion-spinner name="crescent"></ion-spinner>
          } @else {
            <ion-icon name="log-in-outline" slot="start"></ion-icon>
            LOGIN
          }

        </ion-button>

        <div class="register-link">
          <p>Don't have an account?</p>
          <ion-button fill="clear" (click)="goToRegister()">
            Create an Account
          </ion-button>
        </div>

      </ion-card-content>
    </ion-card>

  </div>

</ion-content>
