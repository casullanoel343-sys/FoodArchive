
<ion-header>
  <ion-toolbar color="primary">
    <ion-title>Food Archive</ion-title>
  </ion-toolbar>
</ion-header>

<ion-content class="register-content">

  <div class="register-container">

    <div class="register-logo">
      <ion-icon name="restaurant-outline"></ion-icon>
      <h1>FOOD ARCHIVE</h1>
      <p>Create your personal recipe account</p>
    </div>

    <ion-card class="register-card">

      <ion-card-header>
        <ion-card-title>Create Account</ion-card-title>
        <p>Register to explore delicious recipes.</p>
      </ion-card-header>

      <ion-card-content>

        <!-- USERNAME -->
        <ion-item>
          <ion-icon name="person-outline" slot="start"></ion-icon>
          <ion-input
            label="Username"
            labelPlacement="stacked"
            type="text"
            placeholder="Enter your username"
            [(ngModel)]="username">
          </ion-input>
        </ion-item>

        <!-- EMAIL -->
        <ion-item>
          <ion-icon name="mail-outline" slot="start"></ion-icon>
          <ion-input
            label="Email Address"
            labelPlacement="stacked"
            type="email"
            placeholder="Enter your email"
            [(ngModel)]="email">
          </ion-input>
        </ion-item>

        <!-- PASSWORD -->
        <ion-item>
          <ion-icon name="lock-closed-outline" slot="start"></ion-icon>
          <ion-input
            label="Password"
            labelPlacement="stacked"
            type="password"
            placeholder="Create a password"
            [(ngModel)]="password">
          </ion-input>
        </ion-item>

        <!-- CONFIRM PASSWORD -->
        <ion-item>
          <ion-icon name="lock-closed-outline" slot="start"></ion-icon>
          <ion-input
            label="Confirm Password"
            labelPlacement="stacked"
            type="password"
            placeholder="Confirm your password"
            [(ngModel)]="confirmPassword">
          </ion-input>
        </ion-item>

        <!-- REGISTER BUTTON -->
        <ion-button
          expand="block"
          class="register-button"
          [disabled]="loading"
          (click)="register()">

          @if (loading) {
            <ion-spinner name="crescent"></ion-spinner>
          } @else {
            <ion-icon name="person-add-outline" slot="start"></ion-icon>
            REGISTER
          }

        </ion-button>

        <!-- LOGIN LINK -->
        <div class="login-link">
          <p>Already have an account?</p>

          <ion-button fill="clear" (click)="goToLogin()">
            Login Here
          </ion-button>
        </div>

      </ion-card-content>
    </ion-card>

  </div>

</ion-content>
